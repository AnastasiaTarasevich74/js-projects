<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 в ряд</title>
    <style>
        body {
            margin: 0;
            background: #3f5e4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .game {
            background: #4a6e5c;
            padding: 20px;
            border-radius: 10px;
        }
        .stats {
            background: #d4c9a9;
            padding: 10px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .turn {
            background: #333;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            gap: 2px;
            background: #8b6b4b;
            padding: 10px;
            border-radius: 5px;
        }
        .cell {
            width: 30px;
            height: 30px;
            background: #f0e6d2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .cell.X { color: #c44; }
        .cell.O { color: #44c; }
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #d4c9a9;
            padding: 30px;
            border-radius: 10px;
            display: flex;
            gap: 20px;
        }
        .modal-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: #4a6e5c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="game">
    <div class="stats">
        <span>X: <span id="winX">0</span></span>
        <span>РАУНД <span id="round">1</span></span>
        <span>O: <span id="winO">0</span></span>
        <span class="turn" id="turnText">ХОД: X</span>
    </div>
    <div id="board" class="board"></div>
</div>
<script>
    const STORAGE_KEY = 'g5row_save';
    let board = Array(15).fill().map(() => Array(15).fill(''));
    let currentPlayer = 'X';
    let round = 1;
    let winsX = 0;
    let winsO = 0;
    let gameActive = true;

    const boardEl = document.getElementById('board');
    const winXEl = document.getElementById('winX');
    const winOEl = document.getElementById('winO');
    const roundEl = document.getElementById('round');
    const turnEl = document.getElementById('turnText');

    function renderBoard() {
        boardEl.innerHTML = '';
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                const cell = document.createElement('div');
                cell.className = `cell ${board[i][j]}`;
                cell.textContent = board[i][j] === 'X' ? 'X' : board[i][j] === 'O' ? 'O' : '';
                cell.dataset.row = i;
                cell.dataset.col = j;
                cell.addEventListener('click', cellClickHandler);
                boardEl.appendChild(cell);
            }
        }
    }

    function checkDraw() {
        for (let i = 0; i < 15; i++) {
            for (let j = 0; j < 15; j++) {
                if (board[i][j] === '') return false;
            }
        }
        return true;
    }

    function cellClickHandler(e) {
        if (!gameActive) return;
        const row = +e.currentTarget.dataset.row;
        const col = +e.currentTarget.dataset.col;
        if (board[row][col] !== '') return;
        board[row][col] = currentPlayer;
        renderBoard();
        
        if (checkWin(row, col)) {
            if (currentPlayer === 'X') winsX++; else winsO++;
            winXEl.textContent = winsX;
            winOEl.textContent = winsO;
            saveGameToDB();
            gameActive = false;
            alert(`Игрок ${currentPlayer} выиграл!`);
            resetRound();
            return;
        }
        
        if (checkDraw()) {
            gameActive = false;
            alert('Ничья!');
            resetRound();
            return;
        }
        
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        turnEl.textContent = `ХОД: ${currentPlayer}`;
    }

    function checkWin(row, col) {
        const player = board[row][col];
        if (!player) return false;
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for (let [dx,dy] of dirs) {
            let count = 1;
            for (let step = 1; step < 5; step++) {
                const nr = row + dx * step, nc = col + dy * step;
                if (nr<0||nr>=15||nc<0||nc>=15||board[nr][nc]!==player) break;
                count++;
            }
            for (let step = 1; step < 5; step++) {
                const nr = row - dx * step, nc = col - dy * step;
                if (nr<0||nr>=15||nc<0||nc>=15||board[nr][nc]!==player) break;
                count++;
            }
            if (count >= 5) return true;
        }
        return false;
    }

    function resetRound() {
        board = Array(15).fill().map(() => Array(15).fill(''));
        currentPlayer = 'X';
        gameActive = true;
        round++;
        roundEl.textContent = round;
        turnEl.textContent = 'ХОД: X';
        renderBoard();
        saveGameToDB();
    }

    function newGame() {
        board = Array(15).fill().map(() => Array(15).fill(''));
        currentPlayer = 'X';
        round = 1;
        winsX = 0;
        winsO = 0;
        gameActive = true;
        winXEl.textContent = 0;
        winOEl.textContent = 0;
        roundEl.textContent = 1;
        turnEl.textContent = 'ХОД: X';
        renderBoard();
        localStorage.removeItem(STORAGE_KEY);
    }

    function saveGameToDB() {
        const data = { board, currentPlayer, round, winsX, winsO, gameActive };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadGame() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        const data = JSON.parse(saved);
        board = data.board;
        currentPlayer = data.currentPlayer;
        round = data.round;
        winsX = data.winsX;
        winsO = data.winsO;
        gameActive = data.gameActive;
        winXEl.textContent = winsX;
        winOEl.textContent = winsO;
        roundEl.textContent = round;
        turnEl.textContent = `ХОД: ${currentPlayer}`;
        renderBoard();
        return true;
    }

    function showModal() {
        if (localStorage.getItem(STORAGE_KEY)) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <button class="modal-btn" id="continueBtn">Продолжить</button>
                    <button class="modal-btn" id="restartBtn">Начать заново</button>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('continueBtn').addEventListener('click', () => {
                loadGame();
                document.body.removeChild(modal);
            });
            document.getElementById('restartBtn').addEventListener('click', () => {
                newGame();
                document.body.removeChild(modal);
            });
        } else {
            newGame();
        }
    }

    window.onload = showModal;
</script>
</body>
</html>
