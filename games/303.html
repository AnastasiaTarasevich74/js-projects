<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камень, ножницы, бумага</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #2c3e50;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game {
            background: white;
            max-width: 600px;
            width: 100%;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .stats {
            background: #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }
        .round {
            background: #3498db;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
        .scores {
            display: flex;
            gap: 30px;
        }
        .scores span {
            font-weight: bold;
        }
        .player-score {
            color: #2980b9;
        }
        .computer-score {
            color: #e67e22;
        }
        .arena {
            background: #bdc3c7;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
        }
        .choices {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .choice-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-width: 120px;
            border: 2px solid #7f8c8d;
        }
        .vs {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        .result {
            background: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #7f8c8d;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-bottom: 4px solid #2980b9;
            transition: 0.1s;
            flex: 1 0 120px;
        }
        button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        button.rock {
            background: #7f8c8d;
            border-bottom-color: #5a6263;
        }
        button.scissors {
            background: #e67e22;
            border-bottom-color: #b45f1a;
        }
        button.paper {
            background: #27ae60;
            border-bottom-color: #1e8449;
        }
    </style>
</head>
<body>
    <div class="game">
        <div class="stats">
            <div class="round" id="roundDisplay">Раунд 1</div>
            <div class="scores">
                <span class="player-score" id="playerWinsDisplay">Игрок: 0</span>
                <span class="computer-score" id="computerWinsDisplay">Компьютер: 0</span>
            </div>
        </div>

        <div class="arena">
            <div class="choices">
                <div class="choice-box" id="playerChoiceBox">
                    <div>Игрок</div>
                    <div style="font-size: 48px;" id="playerChoiceIcon"></div>
                </div>
                <div class="vs">VS</div>
                <div class="choice-box" id="computerChoiceBox">
                    <div>Компьютер</div>
                    <div style="font-size: 48px;" id="computerChoiceIcon"></div>
                </div>
            </div>
            <div class="result" id="resultMessage">Нажми кнопку чтобы начать</div>
        </div>

        <div class="buttons">
            <button class="rock" id="rockBtn">💎 КАМЕНЬ</button>
            <button class="scissors" id="scissorsBtn">✂️ НОЖНИЦЫ</button>
            <button class="paper" id="paperBtn">📄 БУМАГА</button>
        </div>
    </div>

    <script>
        const choices = ['камень', 'ножницы', 'бумага'];
        const icons = {
            'камень': '💎',
            'ножницы': '✂️',
            'бумага': '📄'
        };

        let round = 1;
        let playerWins = 0;
        let computerWins = 0;

        const roundDisplay = document.getElementById('roundDisplay');
        const playerWinsDisplay = document.getElementById('playerWinsDisplay');
        const computerWinsDisplay = document.getElementById('computerWinsDisplay');
        const playerChoiceIcon = document.getElementById('playerChoiceIcon');
        const computerChoiceIcon = document.getElementById('computerChoiceIcon');
        const resultMessage = document.getElementById('resultMessage');

        function getComputerChoice() {
            return choices[Math.floor(Math.random() * choices.length)];
        }

        function getWinner(player, computer) {
            if (player === computer) return 'draw';
            if (
                (player === 'камень' && computer === 'ножницы') ||
                (player === 'ножницы' && computer === 'бумага') ||
                (player === 'бумага' && computer === 'камень')
            ) return 'player';
            return 'computer';
        }

        function updateDisplay(playerChoice, computerChoice, winner) {
            playerChoiceIcon.textContent = icons[playerChoice];
            computerChoiceIcon.textContent = icons[computerChoice];
            
            if (winner === 'draw') {
                resultMessage.textContent = `Ничья!`;
            } else if (winner === 'player') {
                resultMessage.textContent = `Победил игрок!`;
            } else {
                resultMessage.textContent = `Победил компьютер!`;
            }
            
            roundDisplay.textContent = `Раунд ${round}`;
            playerWinsDisplay.textContent = `Игрок: ${playerWins}`;
            computerWinsDisplay.textContent = `Компьютер: ${computerWins}`;
        }

        function playRound(playerChoice) {
            const computerChoice = getComputerChoice();
            const winner = getWinner(playerChoice, computerChoice);
            
            if (winner === 'player') playerWins++;
            if (winner === 'computer') computerWins++;
            round++;
            
            updateDisplay(playerChoice, computerChoice, winner);
        }

        document.getElementById('rockBtn').addEventListener('click', () => playRound('камень'));
        document.getElementById('scissorsBtn').addEventListener('click', () => playRound('ножницы'));
        document.getElementById('paperBtn').addEventListener('click', () => playRound('бумага'));
    </script>
</body>
</html>
