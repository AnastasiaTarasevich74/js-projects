<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Найди пару</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #2b5a4c, #1d3e34);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .game-container {
            background: #4c7b6b;
            border-radius: 48px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            padding: 30px;
            position: relative;
            width: 900px;
            max-width: 95vw;
        }
        .timer {
            position: absolute;
            top: 20px;
            right: 30px;
            background: #2c4a3e;
            color: #f0ffe6;
            font-size: 28px;
            font-weight: 700;
            font-family: monospace;
            padding: 12px 24px;
            border-radius: 60px;
            box-shadow: inset 0 -4px 0 #1a2f27, 0 8px 0 #1a2f27;
            letter-spacing: 4px;
        }
        .board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 90px;
            margin-bottom: 20px;
        }
        .card {
            width: 120px;
            height: 120px;
            background: #ffcf9a;
            border-radius: 24px;
            box-shadow: 0 12px 0 #b27a4a, 0 8px 12px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            font-weight: bold;
            color: #5e3c1c;
            cursor: pointer;
            transition: 0.08s linear;
            border: 3px solid #ffb882;
        }
        .card.flipped, .card.matched {
            background: #fef7e6;
            box-shadow: 0 6px 0 #9f8b6b, 0 8px 12px rgba(0,0,0,0.2);
            border: 3px solid #ffeaa5;
        }
        .card.matched {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .new-round-btn {
            display: block;
            margin: 10px auto 0;
            padding: 16px 40px;
            background: #ffe19c;
            border: none;
            border-radius: 60px;
            font-size: 24px;
            font-weight: bold;
            color: #2d4e43;
            box-shadow: 0 10px 0 #c29a4a, 0 6px 12px black;
            cursor: pointer;
            transition: 0.06s;
        }
        .new-round-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #c29a4a, 0 6px 12px black;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="timer" id="timerDisplay">00:00</div>
    <div class="board" id="board"></div>
    <button class="new-round-btn" id="newRoundBtn">🍀 начать новый раунд</button>
</div>
<script>
    (function() {
        const imagesDB = [
            '🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯',
            '🦁', '🐮', '🐸', '🐵', '🐧', '🐦', '🐤', '🐣', '🐥', '🦆',
            '🦅', '🦉', '🦇', '🐺', '🐗', '🐴', '🦄', '🐝', '🐞', '🦋'
        ];

        let currentPairs = 0;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let timerInterval = null;
        let startTime = null;
        let timerRunning = false;
        let previewTimeout = null;
        let canFlip = true;

        const boardEl = document.getElementById('board');
        const timerEl = document.getElementById('timerDisplay');
        const newRoundBtn = document.getElementById('newRoundBtn');

        function formatTimeForDisplay(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function formatTimeForAlert(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = ms % 1000;
            return `${minutes} мин ${seconds} сек ${milliseconds} мс`;
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            timerRunning = false;
        }

        function startTimer() {
            stopTimer();
            startTime = Date.now();
            timerRunning = true;
            timerInterval = setInterval(() => {
                if (startTime) {
                    const elapsed = Date.now() - startTime;
                    timerEl.textContent = formatTimeForDisplay(elapsed);
                }
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            timerEl.textContent = '00:00';
            startTime = null;
            timerRunning = false;
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildDeck(pairCount) {
            if (pairCount > imagesDB.length) pairCount = imagesDB.length;
            const usedIcons = imagesDB.slice(0, pairCount);
            let deck = [];
            usedIcons.forEach((icon, idx) => {
                deck.push({ id: idx, icon, matched: false, element: null });
                deck.push({ id: idx, icon, matched: false, element: null });
            });
            return shuffleArray(deck);
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            cards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.dataset.index = index;
                cardDiv.textContent = ''; 
                card.element = cardDiv;
                cardDiv.addEventListener('click', () => onCardClick(index));
                boardEl.appendChild(cardDiv);
            });
        }

        function flipCard(index, showIcon = true) {
            const card = cards[index];
            if (!card || card.matched) return;
            const el = card.element;
            if (showIcon) {
                el.textContent = card.icon;
                el.classList.add('flipped');
            } else {
                el.textContent = '';
                el.classList.remove('flipped');
            }
        }

        function previewCards(durationMs) {
            canFlip = false;
            cards.forEach((_, i) => flipCard(i, true));
            if (previewTimeout) clearTimeout(previewTimeout);
            previewTimeout = setTimeout(() => {
                cards.forEach((_, i) => {
                    if (!cards[i].matched) flipCard(i, false);
                });
                canFlip = true;
                previewTimeout = null;
            }, durationMs);
        }

        function resetGameState(pairCount, needPreview) {
            stopTimer();
            if (previewTimeout) clearTimeout(previewTimeout);
            previewTimeout = null;
            flippedCards = [];
            matchedPairs = 0;
            canFlip = true;

            currentPairs = pairCount;
            cards = buildDeck(pairCount);
            renderBoard();

            if (needPreview) {
                const previewTime = pairCount * 30;
                previewCards(previewTime);
            }
            startTimer();
        }

        function checkWin() {
            if (matchedPairs === currentPairs) {
                stopTimer();
                const endTime = Date.now();
                const elapsed = startTime ? endTime - startTime : 0;
                setTimeout(() => {
                    alert(`🎉 Поздравляем! Вы нашли все пары!\nВремя: ${formatTimeForAlert(elapsed)}`);
                }, 20);
                return true;
            }
            return false;
        }

        function onCardClick(index) {
            if (!canFlip) return;
            if (!timerRunning) return;
            const card = cards[index];
            if (!card || card.matched) return;
            if (flippedCards.includes(index)) return;
            if (flippedCards.length === 2) return;

            flipCard(index, true);
            flippedCards.push(index);

            if (flippedCards.length === 2) {
                const idx1 = flippedCards[0];
                const idx2 = flippedCards[1];
                const card1 = cards[idx1];
                const card2 = cards[idx2];

                if (card1.id === card2.id) {
                    card1.matched = true;
                    card2.matched = true;
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');
                    matchedPairs++;
                    flippedCards = [];
                    checkWin();
                } else {
                    canFlip = false;
                    setTimeout(() => {
                        if (!cards[idx1].matched) flipCard(idx1, false);
                        if (!cards[idx2].matched) flipCard(idx2, false);
                        flippedCards = [];
                        canFlip = true;
                    }, 500);
                }
            }
        }

        function askPairs() {
            let input = prompt('Введите количество пар (от 1 до 30):', '6');
            if (input === null) return null;
            let pairs = parseInt(input, 10);
            if (isNaN(pairs) || pairs < 1) pairs = 1;
            if (pairs > 30) pairs = 30;
            return pairs;
        }

        function askPreview() {
            return confirm('Показать картинки перед раундом? (30 мс на пару)');
        }

        function initRound() {
            const pairs = askPairs();
            if (pairs === null) {
                return;
            }
            const preview = askPreview();
            resetGameState(pairs, preview);
        }

        newRoundBtn.addEventListener('click', () => {
            stopTimer();
            resetTimer();
            initRound();
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                initRound();
            }, 10);
        });
    })();
</script>
</body>
</html>
