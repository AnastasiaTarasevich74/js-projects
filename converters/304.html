<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер длины</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f5f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .converter-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px -8px rgba(0,20,50,0.2);
            padding: 32px 28px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(0,40,100,0.1);
        }
        h2 {
            font-weight: 500;
            font-size: 1.9rem;
            margin: 0 0 8px 0;
            color: #102a4c;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #3a5670;
            margin-bottom: 30px;
            font-size: 1rem;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
            background: #f0f5ff;
            border-radius: 0 12px 12px 0;
            line-height: 1.4;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .input-group {
            flex: 1 1 200px;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
            color: #2c3f5c;
            margin-bottom: 6px;
        }
        select, input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #dde3ed;
            border-radius: 24px;
            font-size: 1rem;
            background: white;
            transition: 0.15s;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        .number-input {
            background: #fafbff;
        }
        .swap-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0 12px;
        }
        .arrow-icon {
            font-size: 2rem;
            color: #5f7d9c;
            opacity: 0.5;
        }
        .result-block {
            background: #eef4ff;
            border-radius: 30px;
            padding: 16px 24px;
            margin: 18px 0 28px;
            border: 1px solid #cdddfc;
        }
        .result-label {
            font-size: 0.9rem;
            color: #1e3c5a;
            font-weight: 500;
        }
        .result-value {
            font-size: 2.2rem;
            font-weight: 600;
            color: #0c1f33;
            word-break: break-word;
        }
        .convert-btn {
            background: #0a2a44;
            border: none;
            color: white;
            font-size: 1.25rem;
            font-weight: 500;
            padding: 18px 24px;
            border-radius: 50px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
            border: 1px solid #1e3f60;
        }
        .convert-btn:hover {
            background: #1e3f60;
            transform: scale(1.01);
            box-shadow: 0 8px 18px rgba(10,42,68,0.3);
        }
        .convert-btn:active {
            background: #051a2c;
            transform: scale(0.99);
        }
        .footnote {
            text-align: right;
            font-size: 0.75rem;
            color: #7c8ba0;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div class="converter-card">
    <h2>Длина 📏</h2>
    <div class="sub">Метры · футы · дюймы · километры · мили</div>

    <div class="flex-row">
        <div class="input-group">
            <label>Исходная единица</label>
            <select id="fromUnit">
                <option value="m" selected>Метр (м)</option>
                <option value="ft">Фут (ft)</option>
                <option value="in">Дюйм (in)</option>
                <option value="km">Километр (км)</option>
                <option value="mi">Миля (mi)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Конечная единица</label>
            <select id="toUnit">
                <option value="m">Метр (м)</option>
                <option value="ft" selected>Фут (ft)</option>
                <option value="in">Дюйм (in)</option>
                <option value="km">Километр (км)</option>
                <option value="mi">Миля (mi)</option>
            </select>
        </div>
    </div>

    <div class="flex-row">
        <div class="input-group">
            <label>Введите значение</label>
            <input type="number" id="inputValue" class="number-input" value="10" step="any" placeholder="0.00">
        </div>
    </div>

    <div class="swap-area">
        <span class="arrow-icon">⇅</span>
    </div>

    <div class="result-block">
        <div class="result-label">Результат</div>
        <div class="result-value" id="outputDisplay">32.8084</div>
    </div>

    <button class="convert-btn" id="convertBtn">Перевести</button>
</div>

<script>
    (function() {
        const conversionDb = {
            m: 1.0,
            ft: 3.28084,
            in: 39.3701,
            km: 0.001,
            mi: 0.000621371
        };

        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        const inputField = document.getElementById('inputValue');
        const outputSpan = document.getElementById('outputDisplay');
        const convertBtn = document.getElementById('convertBtn');

        function convert() {
            let value = parseFloat(inputField.value);
            if (isNaN(value)) {
                outputSpan.textContent = '0';
                return;
            }

            const fromUnit = fromSelect.value;
            const toUnit = toSelect.value;

            const fromFactor = conversionDb[fromUnit];
            const toFactor = conversionDb[toUnit];

            if (fromFactor === undefined || toFactor === undefined) {
                outputSpan.textContent = '?';
                return;
            }

            const valueInMeters = value / fromFactor;
            const result = valueInMeters * toFactor;

            outputSpan.textContent = result.toFixed(6).replace(/\.?0+$/, '');
        }

        convertBtn.addEventListener('click', convert);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') convert();
        });

        [fromSelect, toSelect].forEach(sel => sel.addEventListener('change', convert));

        convert();
    })();
</script>
</body>
</html>
