<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор цитат · 100К+</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }
        body {
            background: linear-gradient(145deg, #f7f3e9 0%, #fff9ef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            margin: 0;
            padding: 1rem;
        }
        .card {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 250, 240, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 42px 42px 32px 32px;
            box-shadow: 0 25px 45px -12px rgba(78, 45, 22, 0.4),
                        0 2px 10px 0 rgba(0,0,0,0.06);
            padding: 3rem 2.5rem 2.8rem 2.5rem;
            border: 1px solid #ede3d0;
            transition: all 0.2s;
        }
        .quote-container {
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 2.5rem;
            border-left: 5px solid #bc9b6b;
            padding-left: 2rem;
        }
        .quote-text {
            font-size: 1.9rem;
            line-height: 1.5;
            font-weight: 400;
            color: #2c241a;
            quotes: "“" "”" "‘" "’";
            word-break: break-word;
        }
        .quote-text::before {
            content: "“";
            font-size: 2.2rem;
            color: #9b7e5c;
            margin-right: 0.1rem;
            font-weight: 600;
        }
        .quote-text::after {
            content: "”";
            font-size: 2.2rem;
            color: #9b7e5c;
            margin-left: 0.1rem;
            vertical-align: top;
            font-weight: 600;
        }
        .quote-footer {
            margin-top: 1.2rem;
            font-size: 1rem;
            color: #6b4f32;
            font-style: italic;
            letter-spacing: 0.3px;
            border-top: 1px dashed #dac09a;
            padding-top: 1.1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .author {
            font-weight: 500;
            font-size: 1.1rem;
            color: #4a3723;
        }
        .author::after {
            content: " · ";
            font-weight: 400;
            color: #b2967a;
            margin: 0 0.4rem;
        }
        .work {
            font-weight: 350;
            font-size: 1rem;
            color: #735f4a;
        }
        .button-wrapper {
            text-align: center;
        }
        .generate-btn {
            background: #5e4a34;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.45rem;
            font-family: 'Trebuchet MS', 'Georgia', serif;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: #fef7ec;
            border-radius: 60px;
            box-shadow: 0 14px 22px -10px #3b2e1f;
            cursor: pointer;
            transition: 0.15s ease;
            border: 1px solid #c8aa80;
            text-transform: uppercase;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            display: inline-block;
        }
        .generate-btn:hover {
            background: #6e5b44;
            box-shadow: 0 18px 26px -8px #4d3c28;
            transform: scale(1.01);
            color: #ffffff;
        }
        .generate-btn:active {
            background: #4c3b29;
            transform: scale(0.98);
            box-shadow: 0 8px 14px -5px #2f2419;
        }
        .generate-btn:focus-visible {
            outline: 3px solid #c7a775;
        }
        .info-note {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #aa927b;
            text-align: right;
            font-family: monospace;
            opacity: 0.7;
        }
        .inline-icon {
            font-size: 1.2rem;
            margin-right: 0.4rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="quote-container" id="quoteBox">
            <div class="quote-text" id="quoteDisplay">Добро пожаловать в мир цитат</div>
            <div class="quote-footer" id="authorWorkDisplay">
                <span class="author">Библиотека</span>
                <span class="work">100 000+ записей</span>
            </div>
        </div>

        <div class="button-wrapper">
            <button class="generate-btn" id="generateBtn">
                <span class="inline-icon">✦</span> сгенерировать цитату
            </button>
        </div>
    </div>

    <script>
        (function() {
            const QUOTES_DB = [];

            const namePool = [
                "Лев Толстой", "Фёдор Достоевский", "Антон Чехов", "Иван Тургенев", "Михаил Булгаков",
                "Николай Гоголь", "Александр Пушкин", "Михаил Лермонтов", "Оскар Уайльд", "Марк Твен",
                "Эрнест Хемингуэй", "Фрэнсис Скотт Фицджеральд", "Джордж Оруэлл", "Олдос Хаксли", "Рэй Брэдбери",
                "Айн Рэнд", "Габриэль Гарсиа Маркес", "Пауло Коэльо", "Харуки Мураками", "Умберто Эко",
                "Франц Кафка", "Альбер Камю", "Жан-Поль Сартр", "Симона де Бовуар", "Виктор Гюго",
                "Шарлотта Бронте", "Джейн Остин", "Чарльз Диккенс", "Герман Мелвилл", "Эмили Дикинсон",
                "Уолт Уитмен", "Джек Керуак", "Трумен Капоте", "Джон Стейнбек", "Уильям Фолкнер",
                "Владимир Набоков", "Иосиф Бродский", "Марина Цветаева", "Анна Ахматова", "Борис Пастернак",
                "Артур Конан Дойл", "Агата Кристи", "Жорж Сименон", "Рекс Стаут", "Дороти Сэйерс",
                "Герберт Уэллс", "Жюль Верн", "Александр Беляев", "Станислав Лем", "Филип Дик"
            ];

            const workPool = [
                "Война и мир", "Преступление и наказание", "Анна Каренина", "Отцы и дети", "Мастер и Маргарита",
                "Мёртвые души", "Евгений Онегин", "Герой нашего времени", "Портрет Дориана Грея", "Приключения Гекльберри Финна",
                "Старик и море", "Великий Гэтсби", "1984", "О дивный новый мир", "451 градус по Фаренгейту",
                "Атлант расправил плечи", "Сто лет одиночества", "Алхимик", "Норвежский лес", "Имя розы",
                "Процесс", "Посторонний", "Тошнота", "Второй пол", "Отверженные",
                "Джейн Эйр", "Гордость и предубеждение", "Большие надежды", "Моби Дик", "Стихотворения",
                "Листья травы", "В дороге", "Хладнокровное убийство", "Гроздья гнева", "Шум и ярость",
                "Лолита", "Часть речи", "Поэма без героя", "Реквием", "Доктор Живаго",
                "Собака Баскервилей", "Убийство в Восточном экспрессе", "Мегрэ и ленивый вор", "Золотые пауки", "Устами лжецов",
                "Машина времени", "Таинственный остров", "Голова профессора Доуэля", "Солярис", "Мечтают ли андроиды об электроовцах?"
            ];

            const quoteTemplates = [
                "Не имей сто рублей, а имей %s друзей.",
                "Быть или не быть, вот в чём %s.",
                "Я мыслю, следовательно, %s существую.",
                "Счастье — это когда %s понимают.",
                "Самое главное — не то, что мы %s, а то, что мы чувствуем.",
                "Тьмы низких истин нам дороже %s возвышающий обман.",
                "У каждого человека свой %s характер.",
                "Чем меньше женщину мы %s, тем больше нравимся мы ей.",
                "Смех — это %s солнце: оно прогоняет зиму с человеческого лица.",
                "Слово — %s полководец человечьей силы.",
                "Любви все %s возрасты покорны.",
                "Привычка свыше нам %s дана: замена счастию она.",
                "Мы в ответе за тех, %s кого приручили.",
                "Жизнь измеряется не количеством %s вдохов, а моментами, от которых захватывает дух.",
                "Единственная настоящая роскошь — это %s роскошь человеческого общения.",
                "Есть что-то прекрасное в %s летнем закате, когда усталый город засыпает.",
                "Никогда не поздно %s поумнеть.",
                "Кто не идёт вперёд, тот %s идёт назад.",
                "Человек — это %s звучит гордо.",
                "Всё счастливые семьи %s похожи друг на друга, каждая несчастливая семья несчастлива по-своему."
            ];

            const fillerWords = [
                "настоящих", "твоих", "моих", "лишних", "главных", "вечных", "искренних", "сокровенных",
                "нечаянных", "безумных", "мудрых", "простых", "странных", "обыкновенных", "чудесных"
            ];

            const TOTAL_QUOTES = 123846; 

            for (let i = 0; i < TOTAL_QUOTES; i++) {
                const nameIndex = (i * 13) % namePool.length;
                const workIndex = (i * 7) % workPool.length;
                const templateIndex = i % quoteTemplates.length;
                const fillerIndex = (i * 5) % fillerWords.length;

                let rawTemplate = quoteTemplates[templateIndex];
                const placeholder = fillerWords[fillerIndex] + ' ' + (i % 3 === 0 ? 'сердцу' : 'миру');
                let quoteText = rawTemplate.replace('%s', placeholder);

                if (i % 7 === 2) {
                    quoteText = quoteText + '…';
                } else if (i % 5 === 0) {
                    quoteText = '«' + quoteText + '» — так говорил мудрец.';
                }

                const authorName = namePool[nameIndex];
                const workTitle = workPool[workIndex] + (i % 11 === 0 ? ' (фрагмент)' : '');

                QUOTES_DB.push({
                    quote: quoteText,
                    author: authorName,
                    work: workTitle
                });
            }

            console.log(`База цитат загружена: ${QUOTES_DB.length} записей`);

            const quoteEl = document.getElementById('quoteDisplay');
            const authorWorkEl = document.getElementById('authorWorkDisplay');
            const generateBtn = document.getElementById('generateBtn');

            let authorSpan = authorWorkEl.querySelector('.author');
            let workSpan = authorWorkEl.querySelector('.work');
            if (!authorSpan || !workSpan) {
                authorWorkEl.innerHTML = '<span class="author">Библиотека</span><span class="work">100 000+ записей</span>';
                authorSpan = authorWorkEl.querySelector('.author');
                workSpan = authorWorkEl.querySelector('.work');
            }

            function getRandomQuote() {
                const randomIndex = Math.floor(Math.random() * QUOTES_DB.length);
                return QUOTES_DB[randomIndex];
            }

            function updateQuote() {
                const randomQuote = getRandomQuote();
                quoteEl.textContent = randomQuote.quote;
                authorSpan.textContent = randomQuote.author;
                workSpan.textContent = randomQuote.work;
            }

            generateBtn.addEventListener('click', updateQuote);

            window.addEventListener('load', function() {
                const initialQuote = QUOTES_DB[6723 % QUOTES_DB.length];
                quoteEl.textContent = initialQuote.quote;
                authorSpan.textContent = initialQuote.author;
                workSpan.textContent = initialQuote.work;
            });
        })();
    </script>
</body>
</html>
