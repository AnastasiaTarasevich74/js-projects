<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео проигрыватель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .video-container {
            cursor: pointer;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            line-height: 0;
            background: #000;
        }
        .video-container video {
            pointer-events: none;
            display: block;
            width: 100%;
            max-width: 640px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Видео проигрыватель</h1>
    
    <div class="video-container" id="playerBlock">
        <video id="videoPlayer" preload="metadata" muted loop>
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        (function() {
            const block = document.getElementById('playerBlock');
            const video = document.getElementById('videoPlayer');
            
            if (!video || !block) return;
            
            let isPlaying = false;
            
            function togglePlayPause() {
                if (video.paused || video.ended) {
                    video.play()
                        .then(() => {
                            isPlaying = true;
                        })
                        .catch(() => {});
                } else {
                    video.pause();
                    isPlaying = false;
                }
            }
            
            function onPlay() { isPlaying = true; }
            function onPause() { isPlaying = false; }
            function onEnded() { isPlaying = false; }
            
            video.addEventListener('play', onPlay);
            video.addEventListener('pause', onPause);
            video.addEventListener('ended', onEnded);
            
            block.addEventListener('click', togglePlayPause);
        })();
    </script>
</body>
</html>
